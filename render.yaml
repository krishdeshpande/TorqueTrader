services:
  - type: web
    name: torquetrader-api
    runtime: python
    buildCommand: "pip install -r backend-requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true          # Render auto-generates a secret
      - key: DATABASE_URL
        sync: false                  # Existing Supabase PostgreSQL connection string
      - key: REDIS_URL
        sync: false                  # Set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: torquetrader-public
      - key: R2_PRIVATE_BUCKET
        value: torquetrader-private
    healthCheckPath: /health
